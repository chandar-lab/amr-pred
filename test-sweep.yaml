# This will only run a sweep on tree depth, and leave all other parameters at their defaults

program: amr-pred/run_baseline_models.py
name: amr-XGB-test
project: amr-prediction
entity: aselstyne
method: grid
metric: 
  name: mean_balanced_accuracy
  goal: maximize
parameters:
  tree_depth:
    values: [3, 4, 5, 6]
  learning_rate:
    value: 0.3
  subsample:
    value: 1
  colsample_bytree:
    value: 1
  gamma:
    value: 0
  
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--path-dataroot"
  - "../amr_genomic_data/pseudomonas_aeruginosa"
  - "--path-csv"
  - "./datasets"
  - "--pathogen"
  - "pseudomonas_aeruginosa"
  - "--antibiotic"
  - "cefepime"
  - "--k"
  - "31"
  - "--path-precomputed"
  - "./datasets/p_aeruginosa__cefepime__k_31__mode_count__feat_1000K.npz"