defaults:
  - dataset: hard/p_aeruginosa__cefepime
  - model: xgboost
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

seed: 42
debug: False
num_folds: 5

# Primary directories where the data is stored
path_assemblies_root: "/home/mila/n/naga-karthik.enamundram/scratch/amr_genomic_data"
path_datasets_reinterpreted: "/home/mila/n/naga-karthik.enamundram/genomicFMs/ncbi_resistance_phenotypes_asts/datasets_reinterpreted"

# output directory for caching the feature matrix and kmers
path_out_cache: "/home/mila/n/naga-karthik.enamundram/scratch/cache_amr"

# feature matrix parameters
matrix:
  k: 31
  feat_mode: "count"
  max_features: 1_000_000

# argument to build the feature matrix only
build_only: False

# Arguments for the genomic distance based splits
use_genomic_splits: False # If False, will use random splits
split_method: "dashing" #Options: "dashing", "mash", "ani". Only used if use_genomic_splits is True

wandb:
  project: "AMR"
  entity: "naga-karthik"
  use_sweeps: False
  sweep_runs_per_fold: 25
  # mode: "online" # Set to "offline" to disable logging

hydra:
  # Logging configuration: https://hydra.cc/docs/tutorials/basic/running_your_app/logging/
  verbose: False
  # Logs to stdout and to a file.
  job_logging:
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log # Saves to a file in the run directory
        # filename: ${hydra.runtime.output_dir}/${hydra.job.name}_${oc.select:hydra.job.num, 0}.log
  # Set the output directory to /tmp to dump logs.
  run:
    dir: ./results/${now:%Y%m%d}/${now:%H%M%S}
    # dir: /tmp/hydra/logs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./results/${now:%Y%m%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}