defaults:
  - dataset: hard/p_aeruginosa__aztreonam
  - model: xgboost
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

seed: 42
debug: False
num_folds: 5

# Data directories. ${repo_root:} is the root of this repository; other relative paths are relative to the
# directory the scripts are run from.
# Genomes (.fna), downloaded by data/download_dataset.py into <path_assemblies_root>/<species>/
path_assemblies_root: "../amr_genomic_data"
# Training datasets (<species>/filtered/<species>__<drug>_SR_filt.csv): the released ones, or the output of
# data/reinterpret_data_with_mic.py
path_datasets_reinterpreted: "${repo_root:}/benchmark_data/train"
# Released phylogenetic fold assignments (<species>/<species>__<drug>__<split_method>__phyloFolds_<clustering_method>.csv),
# used when they match the run's settings; otherwise the folds are computed into path_out_cache. null always computes them.
path_folds: "${repo_root:}/benchmark_data/folds"

# Output directory for the feature matrix and k-mer caches, computed folds, results and models (<species>/...)
path_out_cache: "./datasets"

# feature matrix parameters
matrix:
  k: 31
  feat_mode: "count"              # Can be set to either "binary" (presence/absence) or "count"
  max_features: 1_000_000         # Set to "None" to use all features. WARNING: This can be extremely memory intensive!
  reduce_dimensionality: False    # True/False, to use the SVD-based dimensionality reduction (fit on each fold's training rows).
  svd_components: 163             # Number of SVD components kept when reduce_dimensionality is True
  subsample_frac: 1.0             # Fraction of genomes to use when building the feature matrix. Use 1.0 for all genomes (default)
  group_columns: True             # Merge k-mer columns identical across all genomes and drop constant ones (model name gets "_grp").
                                  # CV groups each fold on its training rows; test folds use the median over each group's
                                  # k-mers, as at inference. Results differ from ungrouped runs.

# argument to build the feature matrix only
build_only: False

# Device for models that support one (XGBoost): "auto" uses a GPU when one is visible, else the CPU.
# GPU and CPU runs give slightly different results (different random row subsampling).
device: "auto"

# Train only one fold (0 to num_folds-1) or the full-dataset model ("full"), and save its checkpoint.
# Run each part as its own job, then run once more without only_fold to collect the checkpoints and save the results.
only_fold: null

# JSON file of fixed model parameters per part, for runs without sweeps: {"0": {"C": 100}, ..., "full": {...}}
# (keys starting with "_" are ignored). Each fold (and the full-dataset model) is trained with its entry on top of
# model.params. The run name gets "__fold_params", so these runs don't overwrite plain no-sweep runs.
fold_params_file: null

# Arguments for the genomic distance based splits
use_genomic_splits: True          # If False, will use random splits
split_method: "dashing"           # Options: "dashing", "mash", "ani". Only used if use_genomic_splits is True
clustering_method: "hierarchical" # Options: "hierarchical", "unordered". Only used if use_genomic_splits is True

# Arguments for sweeps
use_sweeps: True
sweep_runs_per_fold: 25
# Save every sweep trial (number, parameters, validation score, times) as trials_<part>.csv in the run's checkpoint
# directory, e.g. to plot the best score against the number of trials. Off by default to save time and space.
save_sweep_trials: False


wandb:
  project: "amr-baselines"
  entity: null                    # W&B team or username; null uses the default entity of your W&B account
  # "online", "offline" (log locally, sync later with `wandb sync`) or "disabled".
  # null uses the WANDB_MODE environment variable if set, else "online"
  mode: null

hydra:
  # Logging configuration: https://hydra.cc/docs/tutorials/basic/running_your_app/logging/
  verbose: False
  # Logs to stdout and to a file.
  job_logging:
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log # Saves to a file in the run directory
        # filename: ${hydra.runtime.output_dir}/${hydra.job.name}_${oc.select:hydra.job.num, 0}.log
  # Set the output directory to /tmp to dump logs.
  run:
    dir: ./results/${now:%Y%m%d}/${now:%H%M%S}
    # dir: /tmp/hydra/logs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./results/${now:%Y%m%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}