defaults:
  - dataset: easy/a_baumannii__ciprofloxacin
  - model: xgboost
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

seed: 42
debug: False
num_folds: 5

# output directory for caching the feature matrix and kmers
path_out_cache: /home/mila/n/naga-karthik.enamundram/scratch/cache_amr

# feature matrix parameters
matrix:
  k: 31
  feat_mode: "count"
  max_features: 100_000

# argument to build the feature matrix only
build_only: False

wandb:
  project: "amr-prediction"
  entity: "naga-karthik"
  use_sweeps: False
  sweep_runs_per_fold: 50
  # mode: "online" # Set to "offline" to disable logging

hydra:
  # Logging configuration: https://hydra.cc/docs/tutorials/basic/running_your_app/logging/
  verbose: False
  # Logs to stdout and to a file.
  job_logging:
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log # Saves to a file in the run directory
        # filename: ${hydra.runtime.output_dir}/${hydra.job.name}_${oc.select:hydra.job.num, 0}.log
  # Set the output directory to /tmp to dump logs.
  run:
    dir: /home/mila/n/naga-karthik.enamundram/genomicFMs/results/${now:%Y%m%d}/${now:%H%M%S}
    # dir: /tmp/hydra/logs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: /home/mila/n/naga-karthik.enamundram/genomicFMs/results/${now:%Y%m%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}