# Full kwargs
# https://xgboost.readthedocs.io/en/stable/parameter.html#xgboost-parameters
name: 'XGB'

params:
  _target_: xgboost.XGBClassifier
  validate_parameters: True
  verbosity: 0
  booster: gbtree
  objective: 'binary:logistic'
  eval_metric: 'logloss'
  seed: ${seed}

# Weight the resistant class by n_susceptible / n_resistant of each part's training genomes (scale_pos_weight),
# XGBoost's counterpart of class_weight="balanced": it matches the balanced-accuracy metric (e_coli imipenem is 1% resistant)
balance_classes: true

# Train the full-dataset model after CV and save it (with its TF-IDF and k-mer files) for inference
fit_full_model: true

# Sweep trials run at once: XGBoost uses all CPUs (or the GPU) itself
sweep_n_jobs: 1

# Define hyperparameters for the sweep
sweep:
  method: bayes # search strategy: bayes, grid, or random
  
  metric:
    name: val_balanced_accuracy # Must match the metric logged in WandbFoldTrainer
    goal: maximize # 'maximize' or 'minimize'
    
  # Note: Parameter names here must match the model's __init__ argument names.
  # Ranges as the wide space tested in claude_diag_sweep/diag_wide.py (2026-10-30), with max_depth kept at [3, 6, 9].
  # scale_pos_weight isn't swept: balance_classes sets it from the training genomes.
  parameters:
    max_depth:
      values: [3, 6, 9]

    learning_rate:
      distribution: log_uniform_values
      min: 0.01
      max: 0.3

    n_estimators:
      distribution: int_log_uniform
      min: 50
      max: 1000

    colsample_bytree:
      distribution: uniform
      min: 0.05
      max: 1.0

    min_child_weight:
      distribution: log_uniform_values
      min: 0.5
      max: 20.0

    reg_lambda:
      distribution: log_uniform_values
      min: 0.1
      max: 20.0

    gamma:
      distribution: log_uniform_values
      min: 0.01
      max: 10.0

    subsample:
      distribution: uniform
      min: 0.6
      max: 1.0
