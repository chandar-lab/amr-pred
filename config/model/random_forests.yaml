# Full list of kwargs:
# https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestClassifier.html

name: "RFC"

params:
  _target_: sklearn.ensemble.RandomForestClassifier
  n_jobs: -1  # Use all available CPU cores
  criterion: gini
  random_state: ${seed}
  class_weight: balanced
  # Default settings for the model before the sweep
  n_estimators: 500  # Fixed, not swept: more trees never hurt RF accuracy, only cost time
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: sqrt

# Only cross-validated: skip the full-dataset model, and save no model, TF-IDF or k-mer files for inference
fit_full_model: false

# Sweep trials run at once: random forests use all CPUs (n_jobs: -1) themselves
sweep_n_jobs: 1

# Define hyperparameters for the sweep
sweep:
  method: bayes
  metric:
    name: val_balanced_accuracy
    goal: maximize
  parameters:
    # Grouping merges duplicate k-mer columns, so a resistance gene is only a few columns out of the
    # ~10k-4M grouped ones: sqrt rarely samples it at a split. Fractions scale with the column count.
    max_features:
      values: ['sqrt', 0.01, 0.03]
    max_depth:
      values: [null, 10]  # null is None (unlimited depth); the string "None" would fail in sklearn.
                          # 30 dropped: with a few thousand genomes, trees rarely get that deep, so it acts like null
    min_samples_leaf:
      values: [1, 2, 4]
    # Fraction of genomes each tree's bootstrap draws (null: as many as the training set). Smaller
    # samples decorrelate trees over the clustered lineages and halve the time per tree
    max_samples:
      values: [null, 0.5]