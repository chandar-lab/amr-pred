# Full list of kwargs:
# https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
name: "LGR"

params:
  _target_: sklearn.linear_model.LogisticRegression
  # l1 (lasso) with liblinear: sparse k-mer selection, and it suits few genomes x many columns.
  # Elasticnet (which needs saga) never beat l1 in the earlier sweeps, and saga mostly hit max_iter at large C.
  penalty: l1
  solver: liblinear
  C: 1.0
  # Weight classes inversely to their frequency, matching the balanced-accuracy metric (e_coli imipenem is 1% resistant)
  class_weight: balanced
  max_iter: 2000
  random_state: ${seed}

# Sweep trials run at once: liblinear uses one CPU, so run trials in parallel (-1: all CPUs of the job)
sweep_n_jobs: -1

# Define hyperparameters for the sweep
sweep:
  method: bayes
  metric:
    name: val_balanced_accuracy
    goal: maximize
  parameters:
    C:
      # Inverse of the regularization strength. On TF-IDF features, the earlier (unweighted) sweeps scored exactly 0.5
      # for every C <= 1 and kept choosing C near the top of the range, up to 1e4.
      distribution: log_uniform_values
      min: 1.0
      max: 100000.0
    intercept_scaling:
      distribution: uniform
      min: 0.1
      max: 10.0