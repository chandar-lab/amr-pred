# Full list of kwargs:
# https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
name: "LGR"

params:
  _target_: sklearn.linear_model.LogisticRegression
  # Default settings for the model before the sweep
  penalty: l1
  C: 1.0
  solver: liblinear # Changed from saga to a faster
  max_iter: 1000
  random_state: ${seed}
  l1_ratio: 0.5 # Only used if penalty is 'elasticnet'
  n_jobs: -1

# Sweep trials run at once: liblinear and saga use one CPU, so run trials in parallel (-1: all CPUs of the job)
sweep_n_jobs: -1

# Define hyperparameters for the sweep
sweep:
  method: bayes
  metric:
    name: val_balanced_accuracy
    goal: maximize
  parameters:
    C:
      # The range for the inverse of regularization strength
      distribution: log_uniform_values
      min: 0.001
      max: 10000.0
    intercept_scaling:
      # The range for the intercept scaling factor
      distribution: uniform
      min: 0.1
      max: 10.0